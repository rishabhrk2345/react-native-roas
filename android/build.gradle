group 'com.roassensor.reactnative'
// The BRIDGE's own version, not the native SDK's.
//
// This used to track com.roassensor:roas, so the number answered "which
// roas-android-sdk am I on" without opening the dependencies block. That rule
// no longer works, for the same two reasons roas_flutter abandoned it (see the
// note in its pubspec.yaml). This wraps TWO native SDKs — com.roassensor:roas
// on Android, RoasSensor on iOS — which one number cannot name, and the two do
// not move in lockstep. And it left bridge-only work unreleasable: the ATT /
// SKAdNetwork / appAccountToken / delivery-stream methods added in 0.1.5 are
// pure bridge surface over natives that had already shipped them, and the only
// way to release that under the old rule would have been to move an existing
// tag — which makes one ref mean two different things depending on when it was
// fetched.
//
// So: this number is the BRIDGE's, bumped whenever something ships. The native
// versions it wraps are named in the dependencies block below and in
// react-native-roas.podspec, which is where someone checking them is already
// looking.
//
// 0.1.6 wraps: com.roassensor:roas 0.1.6 (Android), RoasSensor ~> 0.1.7 (iOS) —
// the same natives as 0.1.5. What changed is the bridge: 0.1.5's delivery
// stream (onDeliveryResult) never reached JS on RN's new architecture, and the
// sample was still on RevenueCat. 0.1.6 is the first release a customer app
// should pin, and the one the panel's Setup page names.
//
// 0.1.7 wraps: com.roassensor:roas 0.1.8 (Android), RoasSensor ~> 0.1.9 (iOS) —
// both natives move, which is unusual and is why each is spelled out. The
// bridge adds `verifyPurchase()`, the client half of the backend's
// POST /api/tracking/mobile/purchase; each native carries its half of that
// method. The iOS bump also moves off the build that mislabels every
// TestFlight install as a developer build (see react-native-roas.podspec).
// Android 0.1.8 is on Maven Central (published 2026-09-16) — the dependencies
// block records the detour it took to get there.
//
// The two natives sitting on different numbers is not an oversight — it is the
// situation this versioning rule exists for.
// Keep package.json and react-native-roas.podspec in step.
version '0.1.7'

buildscript {
    ext.kotlin_version = '1.9.24'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

repositories {
    google()
    // mavenLocal() first, as a local-dev convenience for testing an
    // unreleased SDK build — no-op fallthrough to mavenCentral() otherwise,
    // which hosts every published com.roassensor:roas release directly, up to
    // and including the 0.1.7 pinned below. No JitPack workaround is needed.
    mavenLocal()
    mavenCentral()
}

android {
    namespace 'com.roassensor.reactnative'
    compileSdk 34

    defaultConfig {
        // Matches the roas-android-sdk module's own floor (roas/build.gradle.kts).
        minSdk 21
    }

    compileOptions {
        // Matches the RN app's own javac target (RN 0.86's app/build.gradle
        // compiles Java at 17) — a mismatch here fails with "Inconsistent
        // JVM-target compatibility detected for compileDebugJavaWithJavac (17)
        // and compileDebugKotlin (1.8)". A published module can't know its
        // host app's version ahead of time, so if you're on an older RN that
        // still expects 1.8, lower both this and kotlinOptions.jvmTarget below.
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // compileOnly, not implementation: every React Native app already ships
    // its own react-android at runtime. Pulling it in as `implementation`
    // here risks a second, possibly mismatched copy on the classpath — the
    // host app's own RN version is what actually resolves at build time.
    compileOnly 'com.facebook.react:react-android:+'

    // This bridge sat on 0.1.1 — which is 0.1.0 plus setLogLevel/handleDeepLink
    // and nothing else — through two native releases, so an RN app was posting
    // installs with every diagnostic column blank while Kotlin and Flutter apps
    // filled them in. What 0.1.1 does NOT send:
    //
    //   0.1.2  the whole device context (device_model, device_manufacturer,
    //          os_version, api_level, store_version, installer_package, screen,
    //          language, timezone, sdk_version) and the REAL form factor —
    //          0.1.1 hardcodes device_type="mobile", so every RN tablet install
    //          was recorded as a phone. Also the transient-referrer retry, so a
    //          Play read that failed on first launch failed permanently.
    //   0.1.3  play_services_version, app_set_id (duplicate-install detection),
    //          the raw referrer click/install timestamps, beacon signing, the
    //          session model (session_id / session_number / foreground
    //          engagement) and the emulator/root integrity signals.
    //
    // The sessions gap was the expensive one: retention.py withholds a site's
    // headline retention rate until sessionCoverage reaches 100%, so one RN app
    // reporting session_number=0 suppressed that number for the entire site,
    // with nothing pointing at an out-of-date bridge as the cause.
    //   0.1.4  fixes the activity counter that stopped firing onEnterForeground
    //          whenever the SDK is started after the first activity. That is
    //          every React Native app, because initialize() arrives from JS —
    //          long after MainActivity.onStart. Measured on a Flutter build of
    //          the same SDK: engagement_ms froze and no returning user ever
    //          produced a session-start beacon. It also adds the R8 keep rules
    //          without which app_set_id is blank in every minified release build.
    //
    // The pin then went stale AGAIN — 0.1.4 while 0.1.5, 0.1.6 and 0.1.7 shipped.
    // Every one of those is silent from JS: no crash, no log, just weaker or
    // wrong data. What 0.1.4 does NOT do:
    //
    //   0.1.5  handleDeepLink dropped every query parameter except rsclid
    //          (utm_source/rs_campaign/... never reached the backend) and
    //          refused a link carrying a non-rsclid click id (gclid/fbclid)
    //          outright. Plus an OEM data-retention bug where a Vivo kept
    //          resurrecting its old vid/installReported across a real
    //          uninstall+reinstall, a beacon-queue race and a stale-queue leak
    //          that fix exposed, a deferred-link attribution probe for
    //          already-installed users who tap an ad, and the legacy
    //          INSTALL_REFERRER broadcast fallback for installs from non-Play
    //          OEM app stores (Vivo, Xiaomi, Huawei, Samsung, Amazon) — the Play
    //          Install Referrer API alone answers FEATURE_NOT_SUPPORTED there
    //          and nothing else.
    //   0.1.6  the OEM install-referrer pass (Vivo and Huawei read their own
    //          store ContentProvider; Xiaomi and Samsung go through optional
    //          add-on modules), and the fix that made any of it reachable —
    //          OK_NOT_SET / OK_EMPTY were treated as a usable referrer in three
    //          separate places, so the fallback could never fire.
    //
    //          Also `ts` on EVERY beacon, which is the one to care about most
    //          here: nothing Android sent one before, so the backend always fell
    //          back to ingest time — meaning an install that happened offline was
    //          recorded on the day the persisted queue FLUSHED, not the day it
    //          happened. 48h of error measured on a real device. Monday's install
    //          becomes Wednesday's, slides out of its lookback window, and comes
    //          off the campaign that earned it. Plus: identify() now carries
    //          device_id (so the ad id is re-bound on every identify rather than
    //          only at first-open, which is the read most likely to have returned
    //          null), session_number added to three beacons that omitted it, and
    //          uptime_seconds unclamped — it capped at 65535 and a real device
    //          reported 576844.
    // 0.1.8 — on Maven Central since 2026-09-16 — is 0.1.6 plus two things:
    //   0.1.7: handleDeepLink stamps referrer_source="deeplink", as Roas.swift
    //          always did, so one user action no longer lands in two buckets
    //          across the platforms (the standing limitation the README used
    //          to describe is closed).
    //   0.1.8: Roas.verifyPurchase(purchaseToken, productId, isSubscription) —
    //          the Android half of POST /api/tracking/mobile/purchase, which
    //          this bridge's verifyPurchase() calls.
    // Verified before publishing: 24 classes in the AAR (the full 0.1.6 set —
    // Huawei/Vivo readers, DeviceLocation, RoasProps, the install-referrer
    // receiver), unit tests green, real-device runs on 2026-09-14.
    //
    // The number is 0.1.8 and not 0.1.9 on purpose. A mavenLocal "0.1.9" built
    // from a stale 0.1.5 tree (15 classes, no OEM readers) sat on developer
    // machines for a while and this bridge briefly pinned it; Gradle would keep
    // serving that cached AAR under the same coordinates, so the real release
    // took a number nothing had ever used. If a build ever resolves 0.1.9 from
    // ~/.m2, delete it — it is the regression, not a newer SDK.
    implementation 'com.roassensor:roas:0.1.8'

    // GAID (advertising id) — the ONLY source of `device_id` on Android, the
    // strongest identity key an install can carry and what every GAID-keyed
    // CAPI match resolves against.
    //
    // The native SDK declares this `compileOnly` (roas/build.gradle.kts) so a
    // pure-Kotlin app is never forced to carry Play Services, and `DeviceId`
    // reads the class reflectively — which makes an absent classpath entry
    // indistinguishable at runtime from the user opting out of ad tracking. It
    // simply returns null. So without this line an RN app reported no ad id at
    // all and nothing said so: no crash, no log, just a quietly weaker identity
    // graph. Whether it worked was an accident of whether the host app pulled
    // the artifact in transitively (Firebase and AdMob do).
    //
    // Declared HERE rather than in roas-android-sdk on purpose: an RN app is a
    // different audience from a Kotlin one and wants the bridge to work out of
    // the box. The `com.google.android.gms.permission.AD_ID` permission it needs
    // on Android 12+ ships in the native SDK's own manifest and arrives by
    // manifest merge; an app that would rather have no ad id removes it with
    // `tools:node="remove"` and the SDK degrades to referrer-only.
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'

    // Android App Set ID — the ONLY source of `app_set_id`, which backs
    // duplicate-install / device-farm detection. Read reflectively like the GAID
    // and just as silent when absent. A separate artifact from the
    // ads-identifier one above, and NOT pulled in transitively by it.
    //
    // NOT an ads dependency, and it must not be used as one: Google permits the
    // App Set ID for analytics and fraud prevention and forbids it for ads
    // measurement. That is why the backend salt-hashes it and never makes it an
    // IdentityKey.
    implementation 'com.google.android.gms:play-services-appset:16.1.0'
}
